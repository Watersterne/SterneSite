<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学计算器 | 星网</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="profile">
                <div class="profile-avatar">👨‍💻</div>
                <h1 class="profile-name">汪泉</h1>
                <p class="profile-desc">一个记录者而已......</p>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html">🏠 首页</a>
                <a href="posts.html">📝 文章</a>
                <a href="tools.html" class="active">🧰 工具</a>
                <a href="about.html">🙋 关于</a>
            </nav>

            <div class="sidebar-section">
                <h3 class="sidebar-title">主题</h3>
                <button id="theme-toggle" class="theme-btn" title="切换主题">🌙 切换深色模式</button>
            </div>

            <div class="sidebar-footer">
                <p>© 2026 WangQuan</p>
                <p>Powered by Cloudflare Pages</p>
            </div>
        </aside>

        <main class="main">
            <div class="container tool-page">
                <div class="tool-header">
                    <h2>科学计算器</h2>
                    <p>支持三角函数、对数、幂、开方与常数，可用键盘直接输入。</p>
                </div>

                <div class="tool-panel" style="max-width: 560px;">
                    <div class="calc-display">
                        <div class="calc-expr" id="calc-expr">&nbsp;</div>
                        <div class="calc-value" id="calc-value">0</div>
                    </div>
                    <div class="tool-row" style="margin-bottom: 14px;">
                        <div>
                            <label class="tool-label">角度单位</label>
                            <select class="tool-select" id="calc-angle">
                                <option value="deg">度 (DEG)</option>
                                <option value="rad">弧度 (RAD)</option>
                            </select>
                        </div>
                    </div>
                    <div class="calc-keys" id="calc-keys"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/calc.js"></script>
</body>
</html>
