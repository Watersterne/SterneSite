<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 | 星网</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>
    <div class="layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="profile">
                <div class="profile-avatar">👨‍💻</div>
                <h1 class="profile-name">汪泉</h1>
                <p class="profile-desc">一个记录者而已......</p>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html">🏠 首页</a>
                <a href="posts.html" class="active">📝 文章</a>
                <a href="about.html">🙋 关于</a>
            </nav>

            <div class="sidebar-section">
                <h3 class="sidebar-title">分类</h3>
                <div class="filter-tags">
                    <button class="filter-btn active" data-tag="all">全部</button>
                    <button class="filter-btn" data-tag="tech">技术</button>
                    <button class="filter-btn" data-tag="life">生活</button>
                    <button class="filter-btn" data-tag="reading">读书</button>
                </div>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">主题</h3>
                <button id="theme-toggle" class="theme-btn" title="切换主题">🌙 切换深色模式</button>
            </div>

            <div class="sidebar-footer">
                <p>© 2026 WangQuan</p>
                <p>Powered by Cloudflare Pages</p>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main">
            <div class="container">
                <div class="section-header">
                    <h2>📝 最新文章</h2>
                </div>
                <div class="post-grid" id="post-grid">
                    <!-- 文章卡片由 JS 动态生成 -->
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
