<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星网/Creat A New World</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">✦ 我的博客</a>
            <div class="nav-links">
                <a href="index.html" class="active">首页</a>
                <a href="about.html">关于</a>
                <button id="theme-toggle" class="theme-btn" title="切换主题">🌙</button>
            </div>
        </div>
    </nav>

    <!-- 头部横幅 -->
    <header class="hero">
        <div class="hero-content">
            <h1>你好，我是汪泉 👋</h1>
            <p>一个记录者而已......</p>
            <div class="hero-tags">
                <span class="tag">#开发</span>
                <span class="tag">#随笔</span>
                <span class="tag">#读书</span>
            </div>
        </div>
    </header>

    <!-- 文章列表 -->
    <main class="container">
        <div class="section-header">
            <h2>📝 最新文章</h2>
            <div class="filter-tags">
                <button class="filter-btn active" data-tag="all">全部</button>
                <button class="filter-btn" data-tag="tech">技术</button>
                <button class="filter-btn" data-tag="life">生活</button>
                <button class="filter-btn" data-tag="reading">读书</button>
            </div>
        </div>

        <div class="post-grid" id="post-grid">
            <!-- 文章卡片由 JS 动态生成 -->
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <p>© 2026 BLOG POWERED BY WangQuan</p>
            <p class="footer-sub">Powered by Cloudflare Pages</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
