<!DOCTYPE html>

                document.documentElement.setAttribute('data-theme', 'dark');

<body>
    <div class="layout">

        <aside class="sidebar">
            <div class="profile">
                <div class="profile-avatar">👨‍💻</div>
                <p class="profile-name">汪泉</p>
