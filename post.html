<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章标题 | 星网</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>
    <div class="layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="profile">
                <div class="profile-avatar">👨‍💻</div>
                <h1 class="profile-name">汪泉</h1>
                <p class="profile-desc">一个记录者而已......</p>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html">🏠 首页</a>
                <a href="posts.html">📝 文章</a>
                <a href="tools/tools.html">🧰 工具</a>
                <a href="about.html">🙋 关于</a>
            </nav>

            <div class="sidebar-section">
                <h3 class="sidebar-title">主题</h3>
                <button id="theme-toggle" class="theme-btn" title="切换主题">🌙 切换深色模式</button>
            </div>

            <div class="sidebar-footer">
                <p>© 2026 WangQuan</p>
                <p>Powered by Cloudflare Pages</p>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main">
            <div class="container post-page">
                <a href="posts.html" class="back-link">← 返回文章列表</a>
                <article class="post-content" id="post-content">
                    <!-- 由 JS 动态加载 -->
                </article>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
